<body>
  <noscript>
    <main class="noscript">
      <h1>Diagram Editor – vẽ BPMN, UML, Flowchart dạng whiteboard</h1>
      <p>Ứng dụng cần JavaScript để chạy. Hãy bật JavaScript trong trình duyệt.</p>
      <p>Diagram Editor là công cụ vẽ diagram chuyên dụng cho thiết kế phần mềm, chạy hoàn toàn trên trình duyệt, không cần cài đặt hay tài khoản:</p>
      <ul>
        <li><strong>Flowchart</strong> theo ISO 5807: terminator, process, decision, data, document, database…</li>
        <li><strong>BPMN 2.0</strong>: event, task, gateway (XOR, AND, OR), pool, lane, sequence flow, message flow.</li>
        <li><strong>UML 2.5</strong>: use case, activity, state machine, class, package, component, deployment, sequence, communication; kèm <strong>ERD</strong>.</li>
        <li>Mẫu UML theo các quá trình kỹ thuật của ISO/IEC/IEEE 12207.</li>
        <li>Dữ liệu dạng JSON; xuất JSON, SVG, PNG; nhúng SVG trực tiếp vào Markdown.</li>
      </ul>
    </main>
  </noscript>
  <div id="app">
    <!-- ============================== TOOLBAR ============================== -->
    <header id="toolbar">
      <div class="brand"><span class="logo">◆</span> Diagram<b>Editor</b></div>

      <div id="mode-switch" class="mode-switch" role="tablist" title="Chế độ: mỗi chế độ chỉ hiển thị các ký hiệu của loại diagram đó">
        <button data-mode="flowchart">Flowchart</button>
        <button data-mode="bpmn">BPMN</button>
        <button data-mode="uml">UML</button>
      </div>

      <div class="tb-group">
        <button data-action="new" data-icon="new" title="Tài liệu mới"></button>
        <button data-action="open" data-icon="open" title="Mở file diagram .json (Ctrl+O)"></button>
        <select id="template-select" title="Mở diagram mẫu"></select>
      </div>

      <div class="tb-group">
        <button data-action="undo" data-icon="undo" title="Hoàn tác (Ctrl+Z)"></button>
        <button data-action="redo" data-icon="redo" title="Làm lại (Ctrl+Y)"></button>
      </div>

      <div class="tb-group">
        <button data-tool="select" data-icon="pointer" title="Chọn / di chuyển (V)"></button>
        <button data-tool="hand" data-icon="hand" title="Kéo canvas (H, hoặc giữ Space)"></button>
        <button data-tool="connect" data-icon="connect" title="Vẽ đường nối: kéo từ hình này sang hình khác (C)"></button>
        <select id="connector-select" title="Kiểu đường nối mặc định cho đường mới"></select>
      </div>

      <div class="tb-group">
        <button data-action="duplicate" data-icon="duplicate" title="Nhân bản (Ctrl+D)"></button>
        <button data-action="delete" data-icon="trash" title="Xoá (Delete)"></button>
        <button data-action="front" data-icon="front" title="Đưa lên trên cùng (Ctrl+])"></button>
        <button data-action="back" data-icon="back" title="Đưa xuống dưới cùng (Ctrl+[)"></button>
      </div>

      <div class="tb-group">
        <button data-action="zoom-out" data-icon="zoomOut" title="Thu nhỏ (Ctrl −)"></button>
        <button data-action="zoom-reset" id="zoom-label" class="zoom-label" title="Về 100% (Ctrl+0)">100%</button>
        <button data-action="zoom-in" data-icon="zoomIn" title="Phóng to (Ctrl +)"></button>
        <button data-action="fit" data-icon="fit" title="Vừa màn hình (Shift+1)"></button>
        <button data-toggle="grid" data-icon="grid" title="Hiện / ẩn lưới"></button>
        <button data-toggle="snap" data-icon="magnet" title="Bắt dính theo lưới"></button>
        <button data-action="theme" id="theme-btn" title="Chế độ sáng / tối" aria-label="Chuyển chế độ sáng / tối"></button>
      </div>

      <div class="tb-spacer"></div>

      <div class="tb-group download-group">
        <span class="tb-label">Tải xuống</span>
        <button data-action="save" class="text-btn dl-json" title="Tải file JSON – định dạng gốc, mở lại để sửa tiếp (Ctrl+S)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>JSON</button>
        <button data-action="export-svg" class="text-btn dl-svg" title="Tải ảnh vector SVG"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>SVG</button>
        <button data-action="export-png" class="text-btn dl-png" title="Tải ảnh PNG"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PNG</button>
      </div>

      <div class="tb-group last">
        <button data-action="embed" class="text-btn embed-btn" title="Tạo mã SVG để dán thẳng vào file Markdown (.md) – không cần file ảnh bên ngoài"><span class="ico">&lt;/&gt;&nbsp;</span>Nhúng SVG</button>
      </div>
    </header>

    <!-- ============================== PALETTE ============================== -->
    <aside id="palette">
      <div class="pal-search">
        <input id="palette-search" type="search" placeholder="Tìm hình… (gateway, class, actor…)" autocomplete="off">
      </div>
      <div id="palette-list"></div>
    </aside>

    <!-- =============================== CANVAS ============================== -->
    <main id="stage" class="tool-select">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <button id="toggle-left" class="panel-toggle left" aria-controls="palette" aria-expanded="true" title="Thu gọn thư viện hình (Ctrl+B)" aria-label="Thu gọn / mở thư viện hình"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button id="toggle-right" class="panel-toggle right" aria-controls="inspector" aria-expanded="true" title="Thu gọn bảng thuộc tính (Ctrl+Alt+B)" aria-label="Thu gọn / mở bảng thuộc tính"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <!-- ============================ CHAT AI ============================ -->
      <section id="ai-chat" class="ai-chat" aria-label="Chat với AI">
        <div class="ai-chat-top">
          <button type="button" class="ai-chip" data-chat="apikey" title="Thêm / đổi API key của nhà cung cấp AI">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15" cy="9" r="5"/><path d="M11.5 12.5L4 20v1h3v-2h2v-2h2l1.5-1.5M16.5 7.5h.01"/></svg>
            <span>API key</span>
            <span class="ai-dot" title="Chưa có API key"></span>
          </button>
          <button type="button" class="ai-chip" data-chat="context" title="Sao chép ngữ cảnh (diagram hiện tại dạng JSON + quy ước) để dán vào công cụ AI khác">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 012-2h10"/></svg>
            <span>Copy context</span>
          </button>
          <select id="ai-model-quick" class="ai-select ai-select-model" title="Mô hình AI" aria-label="Chọn mô hình AI"></select>
          <select id="ai-effort" class="ai-select" title="Effort: mức độ suy luận / công sức của mô hình – cao hơn thì kỹ hơn nhưng chậm và tốn token hơn" aria-label="Mức effort">
            <option value="">Effort: mặc định</option>
            <option value="low">Effort: thấp</option>
            <option value="medium">Effort: trung bình</option>
            <option value="high">Effort: cao</option>
            <option value="xhigh">Effort: rất cao</option>
            <option value="max">Effort: tối đa</option>
          </select>
          <button type="button" class="ai-chip ai-think" id="ai-think" data-chat="think" aria-pressed="true" title="Bật / tắt thinking (suy luận trước khi trả lời)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
            <span>Thinking</span>
          </button>
          <span class="ai-spacer"></span>
          <span class="ai-turns" id="ai-turns" hidden></span>
          <button type="button" class="ai-icon-btn" data-chat="reset" title="Cuộc trò chuyện mới (AI quên các lượt trước)" aria-label="Cuộc trò chuyện mới" hidden id="ai-reset">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
          </button>
          <button type="button" class="ai-icon-btn" data-chat="minimize" title="Thu nhỏ khung chat" aria-label="Thu nhỏ khung chat">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>
          </button>
        </div>
        <div class="ai-reply" id="ai-reply" hidden>
          <div class="ai-reply-head"><span id="ai-reply-title">AI</span><button type="button" class="ai-icon-btn" data-chat="closereply" title="Đóng" aria-label="Đóng lời đáp">×</button></div>
          <div class="ai-reply-body" id="ai-reply-body"></div>
        </div>
        <div class="ai-busy" id="ai-busy" hidden aria-live="polite">
          <span class="ai-spinner" aria-hidden="true"></span>
          <span class="ai-busy-text" id="ai-busy-text">Vibing…</span>
          <span class="ai-busy-time" id="ai-busy-time">0s</span>
        </div>
        <div class="ai-voice" id="ai-voice" hidden aria-live="polite"><span class="ai-voice-dot" aria-hidden="true"></span><span id="ai-voice-text"></span></div>
        <div class="ai-chat-input">
          <textarea id="ai-prompt" rows="1" spellcheck="false" placeholder="Hỏi AI về diagram này…" title="Ví dụ: “Vẽ quy trình đăng nhập bằng BPMN”, “Giải thích diagram này” – Ctrl+Enter để gửi" aria-label="Nội dung gửi cho AI"></textarea>
          <button type="button" class="ai-icon-btn ai-mic" id="ai-mic" data-chat="mic" aria-pressed="false" title="Nói với AI (Ctrl+M) · chuột phải: cài đặt giọng nói" aria-label="Nhập bằng giọng nói">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
          </button>
          <button type="button" class="ai-icon-btn ai-hf" id="ai-handsfree" data-chat="handsfree" aria-pressed="false" title="Rảnh tay: nói liên tục, AI đáp bằng giọng nói (Ctrl+Shift+M)" aria-label="Chế độ rảnh tay">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
          </button>
          <button type="button" class="ai-send" data-chat="send" disabled title="Gửi (Ctrl+Enter)">
            Gửi <kbd>Ctrl</kbd><span aria-hidden="true">↵</span>
          </button>
        </div>
      </section>
      <button type="button" id="ai-chat-pill" class="ai-chat-pill" hidden title="Mở khung chat AI">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2.5l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
        Chat AI
      </button>

      <textarea id="text-editor" hidden spellcheck="false" placeholder="Nhập nội dung…  (Ctrl+Enter để lưu, Esc để huỷ)"></textarea>
      <div id="toast" hidden></div>
    </main>

    <!-- ============================= INSPECTOR ============================= -->
    <aside id="inspector">
      <div class="tabs">
        <button class="tab active" data-tab="props">Thuộc tính</button>
        <button class="tab" data-tab="json">JSON</button>
        <button class="tab" data-tab="help">Trợ giúp</button>
      </div>
      <div id="tab-props" class="tab-body">
        <div id="props"></div>
      </div>
      <div id="tab-json" class="tab-body" hidden>
        <div class="json-actions">
          <button class="btn primary" data-json="apply" title="Ctrl+Enter">Áp dụng</button>
          <button class="btn" data-json="reload">Tải lại</button>
          <button class="btn" data-json="format">Định dạng</button>
          <button class="btn" data-json="copy">Sao chép</button>
        </div>
        <textarea id="json-text" class="code" spellcheck="false"></textarea>
        <div id="json-msg" class="msg">Toàn bộ diagram được lưu dưới dạng JSON. Sửa trực tiếp rồi bấm "Áp dụng".</div>
      </div>
      <div id="tab-help" class="tab-body" hidden>
        <div id="help"></div>
      </div>
    </aside>

    <!-- ============================= STATUS BAR ============================ -->
    <footer id="statusbar">
      <span id="st-pos">x: 0  y: 0</span>
      <span id="st-count"></span>
      <span id="st-sel"></span>
      <button id="install-btn" class="st-install" hidden title="Cài Diagram Editor như một ứng dụng: mở từ màn hình chính, chạy cả khi offline">⬇ Cài đặt ứng dụng</button>
      <span class="st-hint">Nhấn đúp: sửa chữ · Space + kéo: di chuyển canvas · Ctrl + cuộn: zoom · Tự lưu vào trình duyệt</span>
    </footer>
  </div>

  <input type="file" id="file-input" accept=".json,application/json" hidden>
