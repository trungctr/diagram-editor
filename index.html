    (function () {

</head>
<body>
  <noscript>
    <main class="noscript">
      <h1>Diagram Editor – vẽ BPMN, UML, Flowchart dạng whiteboard</h1>
      <p>Ứng dụng cần JavaScript để chạy. Hãy bật JavaScript trong trình duyệt.</p>
      <p>Diagram Editor là công cụ vẽ diagram chuyên dụng cho thiết kế phần mềm, chạy hoàn toàn trên trình duyệt, không cần cài đặt hay tài khoản:</p>
      <ul>
        <li><strong>Flowchart</strong> theo ISO 5807: terminator, process, decision, data, document, database…</li>
        <li><strong>BPMN 2.0</strong>: event, task, gateway (XOR, AND, OR), pool, lane, sequence flow, message flow.</li>
        <li><strong>UML 2.5</strong>: use case, activity, state machine, class, package, component, deployment, sequence, communication; kèm <strong>ERD</strong>.</li>
        <li>Mẫu UML theo các quá trình kỹ thuật của ISO/IEC/IEEE 12207.</li>
        <li>Dữ liệu dạng JSON; xuất JSON, SVG, PNG; nhúng SVG trực tiếp vào Markdown.</li>
      </ul>
    </main>
  </noscript>
  <div id="app">
    <!-- ============================== TOOLBAR ============================== -->
    <header id="toolbar">
      <div class="brand"><span class="logo">◆</span> Diagram<b>Editor</b></div>

      <div id="mode-switch" class="mode-switch" role="tablist" title="Chế độ: mỗi chế độ chỉ hiển thị các ký hiệu của loại diagram đó">
        <button data-mode="flowchart">Flowchart</button>
        <button data-mode="bpmn">BPMN</button>
        <button data-mode="uml">UML</button>
      </div>

      <div class="tb-group">
        <button data-action="new" data-icon="new" title="Tài liệu mới"></button>
        <button data-action="open" data-icon="open" title="Mở file diagram .json (Ctrl+O)"></button>
        <select id="template-select" title="Mở diagram mẫu"></select>
      </div>

      <div class="tb-group">
        <button data-action="undo" data-icon="undo" title="Hoàn tác (Ctrl+Z)"></button>
        <button data-action="redo" data-icon="redo" title="Làm lại (Ctrl+Y)"></button>
      </div>

      <div class="tb-group">
        <button data-tool="select" data-icon="pointer" title="Chọn / di chuyển (V)"></button>
        <button data-tool="hand" data-icon="hand" title="Kéo canvas (H, hoặc giữ Space)"></button>
        <button data-tool="connect" data-icon="connect" title="Vẽ đường nối: kéo từ hình này sang hình khác (C)"></button>
        <select id="connector-select" title="Kiểu đường nối mặc định cho đường mới"></select>
      </div>

      <div class="tb-group">
        <button data-action="duplicate" data-icon="duplicate" title="Nhân bản (Ctrl+D)"></button>
        <button data-action="delete" data-icon="trash" title="Xoá (Delete)"></button>
        <button data-action="front" data-icon="front" title="Đưa lên trên cùng (Ctrl+])"></button>
        <button data-action="back" data-icon="back" title="Đưa xuống dưới cùng (Ctrl+[)"></button>
      </div>

      <div class="tb-group">
        <button data-action="zoom-out" data-icon="zoomOut" title="Thu nhỏ (Ctrl −)"></button>
        <button data-action="zoom-reset" id="zoom-label" class="zoom-label" title="Về 100% (Ctrl+0)">100%</button>
        <button data-action="zoom-in" data-icon="zoomIn" title="Phóng to (Ctrl +)"></button>
        <button data-action="fit" data-icon="fit" title="Vừa màn hình (Shift+1)"></button>
        <button data-toggle="grid" data-icon="grid" title="Hiện / ẩn lưới"></button>
        <button data-toggle="snap" data-icon="magnet" title="Bắt dính theo lưới"></button>
        <button data-action="theme" id="theme-btn" title="Chế độ sáng / tối" aria-label="Chuyển chế độ sáng / tối"></button>
      </div>

      <div class="tb-spacer"></div>

      <div class="tb-group download-group">
        <span class="tb-label">Tải xuống</span>
        <button data-action="save" class="text-btn dl-json" title="Tải file JSON – định dạng gốc, mở lại để sửa tiếp (Ctrl+S)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>JSON</button>
        <button data-action="export-svg" class="text-btn dl-svg" title="Tải ảnh vector SVG"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>SVG</button>
        <button data-action="export-png" class="text-btn dl-png" title="Tải ảnh PNG"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PNG</button>
      </div>

      <div class="tb-group last">
        <button data-action="embed" class="text-btn embed-btn" title="Tạo mã SVG để dán thẳng vào file Markdown (.md) – không cần file ảnh bên ngoài"><span class="ico">&lt;/&gt;&nbsp;</span>Nhúng SVG</button>
      </div>
    </header>

    <!-- ============================== PALETTE ============================== -->
    <aside id="palette">
      <div class="pal-search">
        <input id="palette-search" type="search" placeholder="Tìm hình… (gateway, class, actor…)" autocomplete="off">
      </div>
      <div id="palette-list"></div>
    </aside>

    <!-- =============================== CANVAS ============================== -->
    <main id="stage" class="tool-select">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <textarea id="text-editor" hidden spellcheck="false" placeholder="Nhập nội dung…  (Ctrl+Enter để lưu, Esc để huỷ)"></textarea>
      <div id="toast" hidden></div>
    </main>

    <!-- ============================= INSPECTOR ============================= -->
    <aside id="inspector">
      <div class="tabs">
        <button class="tab active" data-tab="props">Thuộc tính</button>
        <button class="tab" data-tab="json">JSON</button>
        <button class="tab" data-tab="help">Trợ giúp</button>
      </div>
      <div id="tab-props" class="tab-body">
        <div id="props"></div>
      </div>
      <div id="tab-json" class="tab-body" hidden>
        <div class="json-actions">
          <button class="btn primary" data-json="apply" title="Ctrl+Enter">Áp dụng</button>
          <button class="btn" data-json="reload">Tải lại</button>
          <button class="btn" data-json="format">Định dạng</button>
          <button class="btn" data-json="copy">Sao chép</button>
        </div>
        <textarea id="json-text" class="code" spellcheck="false"></textarea>
        <div id="json-msg" class="msg">Toàn bộ diagram được lưu dưới dạng JSON. Sửa trực tiếp rồi bấm "Áp dụng".</div>
      </div>
      <div id="tab-help" class="tab-body" hidden>
        <div id="help"></div>
      </div>
    </aside>

    <!-- ============================= STATUS BAR ============================ -->
    <footer id="statusbar">
      <span id="st-pos">x: 0  y: 0</span>
      <span id="st-count"></span>
      <span id="st-sel"></span>
      <button id="install-btn" class="st-install" hidden title="Cài Diagram Editor như một ứng dụng: mở từ màn hình chính, chạy cả khi offline">⬇ Cài đặt ứng dụng</button>
      <span class="st-hint">Nhấn đúp: sửa chữ · Space + kéo: di chuyển canvas · Ctrl + cuộn: zoom · Tự lưu vào trình duyệt</span>
    </footer>
  </div>

  <input type="file" id="file-input" accept=".json,application/json" hidden>

  <script src="js/util.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/render.js"></script>
  <script src="js/store.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/help.js"></script>
  <script src="js/export.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
